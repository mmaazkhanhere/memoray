[project]
name = "memoray"
version = "0.1.0"
description = "A reminder agent with provider-agnostic LLM tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "groq>=0.13,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "cryptography>=43,<47",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
reminder-worker = "app.notifications.worker:main"
sync-vapi-assistant = "app.integrations.vapi.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

