services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memoray
      POSTGRES_USER: memoray
      POSTGRES_PASSWORD: memoray
    ports:
      - "5432:5432"
    volumes:
      - memoray-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoray -d memoray"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memoray-postgres:

